<!doctype html><html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#17110d;padding:0}
.og{position:relative;display:grid;grid-template-columns:690px 1fr;gap:40px;align-items:center;height:630px;padding:0 0 0 64px;overflow:hidden}
.og::before{content:"";position:absolute;inset:-30% 20% auto -10%;height:120%;background:radial-gradient(closest-side,rgb(244 181 68 / .18),transparent 70%)}
.og-logo{width:300px;margin-bottom:40px;position:relative}
.og h1{position:relative;isolation:isolate;white-space:nowrap;font-stretch:62%;font-weight:850;text-transform:uppercase;line-height:.9;font-size:96px;color:#f6f0e6;margin:0}
.og h1 span{display:block;background:linear-gradient(180deg,#ffd27a 10%,#f4b544 45%,#ee6a2c 95%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.og h1 span::before{content:"";position:absolute;z-index:-1;top:50%;left:-64px;right:-30px;height:6px;transform:translateY(-50%);background:linear-gradient(180deg,#5d534c 0%,#e9e0d4 30%,#a99c91 55%,#3b332d 100%);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,0 100%)}
.og p{position:relative;margin-top:34px;font-family:"DM Mono",monospace;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#b7a898}
.og-photo{height:630px;overflow:hidden}
.og-photo img{width:100%;height:100%;object-fit:cover}
</style></head><body>
<div class="og">
  <div>
    <img class="og-logo" src="../assets/img/logo-971.webp" alt="">
    <h1>Elke dag<span>vers van het spit.</span></h1>
    <p>Osdorp · Westpoort · Haarlem · 100% halal</p>
  </div>
  <div class="og-photo"><img src="../assets/img/kip-grillen-800.webp" alt=""></div>
</div>
</body></html>
