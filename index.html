<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PureVita previews</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--paper:#F3EFE8;--ink:#141312;--mute:#5E5850;--line:rgba(20,19,18,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Geist",Helvetica,Arial,sans-serif;padding:24px 16px}
main{width:100%;max-width:520px;display:grid;gap:28px}
h1{margin:0;font:400 clamp(3rem,12vw,4.5rem)/.9 "Instrument Serif",Georgia,serif;letter-spacing:-.03em}
h1 em{font-style:italic}
p{margin:0;color:var(--mute)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font:400 1.75rem/1.1 "Instrument Serif",Georgia,serif}
a span{font:400 .875rem "Geist",sans-serif;color:var(--mute)}
a:hover,a:focus-visible{color:#7B5B25}
:focus-visible{outline:2px solid #7B5B25;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Pure<em>Vita</em></h1>
  <p>Preview van de website en de app. Prototype, niet de live site.</p>
  <ul>
    <li><a href="purevita/">Website <span>Personal training en reformer pilates</span></a></li>
    <li><a href="purevita/app/">App <span>Boeken, trainen, voortgang</span></a></li>
  </ul>
</main>
</body>
</html>
